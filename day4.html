<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 4 · Departure</title>
<link rel="stylesheet" href="style.css">
<style>
  .hero { background-image: url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?q=80&w=2000&auto=format&fit=crop'); }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-content">
    <span class="hero-badge">Day 4 · 01 Dec 2026</span>
    <h1>Departure</h1>
    <p>Goodbye Phu Quoc · PQC to KUL</p>
  </div>
</div>

<nav class="nav-container">
  <div class="nav-bar">
    <a href="index.html">Home</a>
    <a href="day1.html">Day 1</a>
    <a href="day2.html">Day 2</a>
    <a href="day3.html">Day 3</a>
    <a href="day4.html" class="active">Day 4</a>
  </div>
</nav>

<div class="container">
  <div class="page-header">
    <div class="page-title">
      <h2>Day 4 Itinerary</h2>
      <p>Click "Edit Mode" to make changes to your schedule</p>
    </div>
    <div class="budget-pill" id="dayBudget">💰 Total: RM 0.00</div>
  </div>

  <div class="timeline" id="timeline"></div>

  <div class="action-bar">
    <button class="btn btn-primary" id="editBtn" onclick="toggleEdit()">✏️ Enter Edit Mode</button>
    <button class="btn btn-success" onclick="addStop()" id="addBtn" style="display:none;">➕ Add New Stop</button>
    <button class="btn btn-outline" onclick="window.print()">🖨️ Print / PDF</button>
    <button class="btn btn-warning" onclick="resetDay()">↺ Reset Defaults</button>
  </div>

  <div class="global-summary" id="globalSummary">
    <h3>Total Trip Cost (4 Days)</h3>
    <div class="total-amount" id="grandTotal">RM 0.00</div>
    <p>Calculated from all days (Hotel & Flight excluded)</p>
  </div>
</div>

<div class="toast" id="toast">✓ Saved Successfully</div>

<script>
const DAY_ID = 'day4';
const DEFAULT_STOPS = [
  {time:"6:00 – 6:45 AM", cost:"Free", title:"Check-out Hotel", desc:"Check-out di bilik hotel. RTE food untuk sarapan.", commute:"🏨 Di bilik hotel", tags:[]},
  {time:"6:45 – 7:30 AM", cost:"RM 75", title:"Ke Lapangan Terbang PQC", desc:"Bertolak awal untuk elak kesesakan.", commute:"🚗 Grab Car 4-Seater", tags:[]},
  {time:"7:30 – 9:00 AM", cost:"Free", title:"Check-In & Imigresen", desc:"Lengkapkan urusan lapangan terbang.", commute:"🚶 Berjalan kaki", tags:[]},
  {time:"9:00 – 10:00 AM", cost:"Free", title:"Menunggu Penerbangan", desc:"Sarapan dan persiapan.", commute:"", tags:[]},
  {time:"10:00 AM – 12:55 PM (MY)", cost:"Flight", title:"Penerbangan PQC → KUL", desc:"Penerbangan pulang AirAsia.", commute:"", tags:[{text:"✈️ AirAsia", cls:"transport"}]},
  {time:"1:00 PM onward", cost:"RM 75", title:"Ketibaan di Malaysia", desc:"Pulang ke rumah.", commute:"🚗 Grab Car / KLIA Ekspres", tags:[]}
];

const STORAGE_KEY = 'pq_' + DAY_ID;
let stops = [];
let isEditing = false;
let saveTimer;

function init() {
  const saved = localStorage.getItem(STORAGE_KEY);
  stops = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(DEFAULT_STOPS));
  render();
  updateGlobalTotal();
}

function render() {
  const tl = document.getElementById('timeline');
  tl.innerHTML = stops.map((s, i) => `
    <div class="stop-card">
      <div class="stop-dot"></div>
      <div class="stop-header">
        <span class="stop-time" contenteditable="${isEditing}" data-i="${i}" data-f="time">${s.time}</span>
        <span class="stop-cost" contenteditable="${isEditing}" data-i="${i}" data-f="cost">${s.cost}</span>
      </div>
      <div class="stop-title" contenteditable="${isEditing}" data-i="${i}" data-f="title">${s.title}</div>
      <div class="stop-desc" contenteditable="${isEditing}" data-i="${i}" data-f="desc">${s.desc}</div>
      ${s.commute ? `<div class="commute-tag" contenteditable="${isEditing}" data-i="${i}" data-f="commute">${s.commute}</div>` : `<div class="commute-tag" contenteditable="${isEditing}" data-i="${i}" data-f="commute" style="opacity:0.5">(add commute)</div>`}
      
      <div class="tags-container">
        ${s.tags.map((t, j) => `
          <span class="tag ${t.cls || 'default'}">
            ${t.text}
            ${isEditing ? `<span style="cursor:pointer;margin-left:6px;color:red;" onclick="removeTag(${i},${j})">✕</span>` : ''}
          </span>
        `).join('')}
        ${isEditing ? `<span class="tag default" style="cursor:pointer;" onclick="addTag(${i})">+ Add Tag</span>` : ''}
      </div>

      <div class="stop-tools">
        <button class="tool-btn" onclick="move(${i}, -1)">↑ Up</button>
        <button class="tool-btn" onclick="move(${i}, 1)">↓ Down</button>
        <button class="tool-btn" onclick="dupe(${i})">⧉ Duplicate</button>
        <button class="tool-btn del" onclick="del(${i})">🗑 Delete</button>
      </div>
    </div>
  `).join('');

  if (isEditing) {
    document.querySelectorAll('[contenteditable="true"]').forEach(el => {
      el.addEventListener('input', (e) => {
        const i = +e.target.dataset.i;
        const f = e.target.dataset.f;
        stops[i][f] = e.target.innerText;
        autoSave();
        updateBudget();
      });
    });
  }
  updateBudget();
}

function updateBudget() {
  let total = 0;
  stops.forEach(s => {
    const match = String(s.cost).replace(/,/g, '').match(/(\d+(?:\.\d+)?)/);
    if (match) total += parseFloat(match[1]);
  });
  document.getElementById('dayBudget').innerHTML = `💰 Total: RM ${total.toFixed(2)}`;
  localStorage.setItem(STORAGE_KEY + '_total', total);
  updateGlobalTotal();
}

function updateGlobalTotal() {
  let grand = 0;
  ['day1','day2','day3','day4'].forEach(d => {
    const val = parseFloat(localStorage.getItem('pq_' + d + '_total')) || 0;
    grand += val;
  });
  const el = document.getElementById('grandTotal');
  if(el) el.innerText = `RM ${grand.toFixed(2)}`;
}

function autoSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(stops));
    showToast();
  }, 500);
}

function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

function toggleEdit() {
  isEditing = !isEditing;
  document.body.classList.toggle('editing', isEditing);
  const btn = document.getElementById('editBtn');
  const addBtn = document.getElementById('addBtn');
  
  if (isEditing) {
    btn.innerHTML = '💾 Save & View Mode';
    btn.classList.replace('btn-primary', 'btn-success');
    addBtn.style.display = 'inline-flex';
  } else {
    btn.innerHTML = '✏️ Enter Edit Mode';
    btn.classList.replace('btn-success', 'btn-primary');
    addBtn.style.display = 'none';
    localStorage.setItem(STORAGE_KEY, JSON.stringify(stops));
  }
  render();
}

function addStop() {
  stops.push({time:"New Time", cost:"RM 0", title:"New Activity", desc:"Description...", commute:"", tags:[]});
  render();
  setTimeout(() => {
    const cards = document.querySelectorAll('.stop-card');
    cards[cards.length-1].scrollIntoView({behavior:'smooth', block:'center'});
  }, 50);
}

function del(i) { if(confirm('Delete this stop?')) { stops.splice(i, 1); render(); autoSave(); } }
function dupe(i) { stops.splice(i + 1, 0, JSON.parse(JSON.stringify(stops[i]))); render(); autoSave(); }
function move(i, dir) {
  const ni = i + dir;
  if(ni < 0 || ni >= stops.length) return;
  [stops[i], stops[ni]] = [stops[ni], stops[i]];
  render(); autoSave();
}
function addTag(i) {
  const text = prompt('Tag name (e.g. 🍽️ Halal):'); if(!text) return;
  const cls = prompt('Type (food / activity / transport):') || 'default';
  stops[i].tags.push({text, cls}); render(); autoSave();
}
function removeTag(i, j) { stops[i].tags.splice(j, 1); render(); autoSave(); }
function resetDay() {
  if(confirm('Reset Day 4 to defaults? Your edits will be lost.')) {
    stops = JSON.parse(JSON.stringify(DEFAULT_STOPS));
    localStorage.removeItem(STORAGE_KEY); render(); autoSave();
  }
}
init();
</script>
</body>
</html>
