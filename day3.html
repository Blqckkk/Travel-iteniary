<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 3 · VinWonders</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-day="day3">

<header>
  <h1>Day 3 — VinWonders Full Day</h1>
  <p>30 Nov 2026 · One full day at VinWonders</p>
</header>

<nav class="day-nav">
  <a href="index.html">🏠 Home</a>
  <a href="day1.html">Day 1</a>
  <a href="day2.html">Day 2</a>
  <a href="day3.html" class="active">Day 3</a>
  <a href="day4.html">Day 4</a>
</nav>

<div class="container">
  <h2 class="day-title">Day 3 — VinWonders Full Day</h2>
  <p class="day-subtitle">30 Nov 2026 · One full day at VinWonders</p>
  <span class="day-budget" id="day-budget">Day 3 total: RM 380</span>

  <div class="timeline" id="timeline"></div>

  <div class="action-bar">
    <button class="btn btn-add" onclick="addStop()">➕ Add Stop</button>
    <button class="btn btn-print" onclick="window.print()">🖨️ Print / PDF</button>
    <button class="btn btn-reset" onclick="resetDay()">↺ Reset to Default</button>
  </div>
</div>

<div class="save-status" id="saveStatus">✓ Saved</div>
<footer>Phu Quoc 4D3N · Day 3</footer>

<script>
const STORAGE_KEY = 'pq_day3_v1';

const DEFAULT_STOPS = [
  {time:"8:00 – 9:00 AM", cost:"Free", title:"Breakfast & Siap ke VinWonders",
   desc:"RTE food disediakan.", commute:"", tags:[]},
  {time:"9:00 – 10:00 AM", cost:"RM 380", title:"European Streetmosphere",
   desc:"One full day VinWonders ticket. Walk/Buggy.",
   commute:"🚶 Walk / Buggy", tags:[{text:"🎢 VinWonders", cls:"activity"}]},
  {time:"10:00 – 11:30 AM", cost:"Included", title:"Fantasy World & Ferris Wheel",
   desc:"Zon Fantasy World dengan Ferris Wheel dan rides keluarga.", commute:"", tags:[]},
  {time:"11:30 AM – 1:00 PM", cost:"Included", title:"Mysterious Viking Village & Lunch",
   desc:"Meneroka Viking Village dan makan tengah hari.", commute:"", tags:[{text:"🍽️ Lunch", cls:"food"}]},
  {time:"1:15 – 3:00 PM", cost:"Included", title:"The Sea Shell (Aquarium)",
   desc:"Aquarium gergasi — antara tarikan utama VinWonders.", commute:"", tags:[{text:"🐠 Aquarium", cls:"activity"}]},
  {time:"2:00 – 2:20 PM", cost:"Included", title:"Colors of the Ocean (Mermaid Show)",
   desc:"Pertunjukan mermaid di dalam aquarium.", commute:"", tags:[]},
  {time:"3:00 – 4:30 PM", cost:"Included", title:"Adventure World (Indoor Games)",
   desc:"Indoor games — sesuai untuk rehat dari panas.", commute:"", tags:[]},
  {time:"4:30 – 5:30 PM", cost:"Included", title:"Street Carnival & Snack Break",
   desc:"Street carnival dan rehat snack.", commute:"", tags:[]},
  {time:"5:30 – 5:35 PM", cost:"Included", title:"Musical Fountain Show",
   desc:"Persembahan fountain muzik.", commute:"", tags:[]},
  {time:"5:45 – 6:30 PM", cost:"Free", title:"Early Dinner",
   desc:"RTE food — makan awal sebelum show malam.", commute:"", tags:[]},
  {time:"6:30 – 7:05 PM", cost:"Included", title:"\"ONCE\" Show & Fireworks",
   desc:"Show utama VinWonders diakhiri dengan fireworks. Jangan lepas!",
   commute:"", tags:[{text:"🎆 Fireworks", cls:"activity"}]},
  {time:"8:00 PM onward", cost:"Free", title:"Kemas Luggage / Free & Easy",
   desc:"Balik hotel, kemas beg untuk penerbangan esok.", commute:"", tags:[]}
];

let stops = [];
let saveTimer;

function loadStops(){
  try{
    const saved = localStorage.getItem(STORAGE_KEY);
    stops = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(DEFAULT_STOPS));
  }catch(e){ stops = JSON.parse(JSON.stringify(DEFAULT_STOPS)); }
  render();
}

function saveStops(showToast=true){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(stops));
    if(showToast) showSaveStatus();
  }, 400);
}

function showSaveStatus(){
  const el = document.getElementById('saveStatus');
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 1200);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  const tl = document.getElementById('timeline');
  tl.innerHTML = stops.map((s,i)=>`
    <div class="stop" data-idx="${i}">
      <div class="stop-head">
        <span class="stop-time" contenteditable="true" data-field="time" data-idx="${i}">${escapeHtml(s.time)}</span>
        <span class="stop-cost" contenteditable="true" data-field="cost" data-idx="${i}">${escapeHtml(s.cost)}</span>
      </div>
      <h3 contenteditable="true" data-field="title" data-idx="${i}">${escapeHtml(s.title)}</h3>
      <p contenteditable="true" data-field="desc" data-idx="${i}">${escapeHtml(s.desc)}</p>
      ${s.commute ? `<div class="commute" contenteditable="true" data-field="commute" data-idx="${i}">${escapeHtml(s.commute)}</div>` : `<div class="commute" contenteditable="true" data-field="commute" data-idx="${i}" style="opacity:.4">(add commute)</div>`}
      <div class="tags">
        ${s.tags.map((t,j)=>`<span class="tag ${t.cls}">${escapeHtml(t.text)}
          <span style="cursor:pointer;margin-left:6px;opacity:.6" onclick="removeTag(${i},${j})">×</span>
        </span>`).join('')}
        <span class="tag" style="cursor:pointer;background:#f0f6f9;color:var(--muted)" onclick="addTag(${i})">+ tag</span>
      </div>
      <div class="stop-tools">
        <button class="tool-btn" onclick="moveStop(${i},-1)">↑ Up</button>
        <button class="tool-btn" onclick="moveStop(${i},1)">↓ Down</button>
        <button class="tool-btn" onclick="duplicateStop(${i})">⧉ Duplicate</button>
        <button class="tool-btn del" onclick="deleteStop(${i})">🗑 Delete</button>
      </div>
    </div>
  `).join('');

  tl.querySelectorAll('[contenteditable]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const idx = +el.dataset.idx;
      const field = el.dataset.field;
      stops[idx][field] = el.innerText;
      saveStops();
    });
  });
  updateBudget();
}

function updateBudget(){
  let total = 0;
  stops.forEach(s=>{
    const m = String(s.cost).match(/(\d+(?:\.\d+)?)/);
    if(m) total += parseFloat(m[1]);
  });
  document.getElementById('day-budget').innerText = 'Day total: RM ' + total.toFixed(2);
}

function addStop(){
  stops.push({time:"New time", cost:"RM 0", title:"New stop", desc:"Description…", commute:"", tags:[]});
  saveStops(); render();
  setTimeout(()=>{
    const last = document.querySelector('.stop:last-child');
    if(last) last.scrollIntoView({behavior:'smooth',block:'center'});
  },50);
}
function deleteStop(i){ if(!confirm('Delete this stop?')) return; stops.splice(i,1); saveStops(); render(); }
function duplicateStop(i){ stops.splice(i+1,0, JSON.parse(JSON.stringify(stops[i]))); saveStops(); render(); }
function moveStop(i,dir){ const ni=i+dir; if(ni<0||ni>=stops.length)return; [stops[i],stops[ni]]=[stops[ni],stops[i]]; saveStops(); render(); }
function addTag(i){
  const text = prompt('Tag text:'); if(!text) return;
  const cls = prompt('Type: food / activity / transport / (blank)') || '';
  stops[i].tags.push({text, cls:['food','activity','transport'].includes(cls)?cls:''});
  saveStops(); render();
}
function removeTag(i,j){ stops[i].tags.splice(j,1); saveStops(); render(); }
function resetDay(){
  if(!confirm('Reset Day 3 to default? Your edits will be lost.')) return;
  localStorage.removeItem(STORAGE_KEY); loadStops();
}
loadStops();
</script>
</body>
</html>
